<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ACT Instrumento Clínico</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Vendored locally so the app works offline and never depends on a CDN being reachable -->
    <script src="vendor/anime.min.js"></script>
    <script src="vendor/lucide.min.js"></script>
    <script>
        // Safety net: if a library failed to load (offline, blocked, corrupt),
        // provide no-op fallbacks so a missing icon/animation never aborts init.
        window.lucide = window.lucide || { createIcons() {} };
        if (typeof window.anime === 'undefined') {
            const noop = () => ({ pause() {}, restart() {}, play() {} });
            noop.timeline = () => { const tl = { add() { return tl; }, pause() {}, play() {} }; return tl; };
            noop.random = (min = 0) => min;
            noop.stagger = () => 0;
            noop.set = () => {};
            window.anime = noop;
        }
    </script>
    <link rel="manifest" href="manifest.json">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Fira+Sans:wght@400;600;700&family=Nunito:wght@400;600;700&family=Outfit:wght@300;400;600;700&family=Permanent+Marker&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles/main.css">
</head>

<body data-theme="dark">
    <div id="app">
        <!-- Application Content will be injected here -->
        <header style="justify-content: flex-end; margin-bottom: 1rem;">
            <button id="theme-toggle" class="btn-ghost btn-icon" aria-label="Cambiar tema" title="Cambiar tema"><i data-lucide="sun-medium" style="width: 1.1rem; height: 1.1rem;"></i></button>
        </header>

        <main id="main-content" class="screen">
            <!-- Loading state or default view -->
            <div class="loader">Cargando experiencia clínica...</div>
        </main>

        <footer class="disclaimer">
            “Esta herramienta apoya el trabajo clínico, no lo sustituye.”
        </footer>

        <button id="btn-sos" class="btn-primary" aria-label="Abrir módulo SOS de crisis" title="SOS · Regulación en crisis"><span style="font-size: 0.8rem; font-weight: 800; letter-spacing: 0.5px;">SOS</span></button>
    </div>

    <!-- Scripts -->
    <script src="app.js" type="module"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => {
                        function promptUpdate(worker) {
                            if (document.getElementById('sw-update-banner')) return;
                            const banner = document.createElement('div');
                            banner.id = 'sw-update-banner';
                            banner.style.cssText = 'position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%); z-index: 10000; background: var(--color-surface, #1e293b); color: var(--color-text-primary, #ffffff); border: 1px solid var(--color-primary, #fbbf24); border-radius: var(--radius-sm, 12px); padding: 0.6rem 1rem; display: flex; align-items: center; gap: 0.8rem; box-shadow: var(--glass-shadow); font-size: 0.82rem; backdrop-filter: blur(8px);';
                            banner.innerHTML = `
                                <span>Nueva versión disponible</span>
                                <button class="btn-primary" id="btn-sw-reload" style="padding: 0.25rem 0.6rem; font-size: 0.78rem;">Actualizar</button>
                                <button class="btn-ghost btn-icon" id="btn-sw-dismiss" style="padding: 0.1rem; font-size: 0.8rem;" aria-label="Cerrar aviso">✕</button>
                            `;
                            banner.querySelector('#btn-sw-reload')?.addEventListener('click', () => {
                                worker.postMessage({ type: 'SKIP_WAITING' });
                            });
                            banner.querySelector('#btn-sw-dismiss')?.addEventListener('click', () => {
                                banner.remove();
                            });
                            document.body.appendChild(banner);
                        }

                        if (reg.waiting) {
                            promptUpdate(reg.waiting);
                        }

                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            if (!newWorker) return;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    promptUpdate(newWorker);
                                }
                            });
                        });
                    })
                    .catch(err => console.log('SW failed', err));

                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        refreshing = true;
                        window.location.reload();
                    }
                });
            });
        }
    </script>
</body>

</html>
